name: CI-PoC003 full six-vCPU venv context diagnostics
run-name: CI-PoC003 venv-context ${{ inputs.comparison_id }}

on:
  workflow_dispatch:
    inputs:
      comparison_id:
        description: Fresh source-gate comparison UUID allocated before dispatch
        required: true
        type: string

permissions:
  contents: read

jobs:
  hosted-tcg:
    name: Diagnostic full six-CPU TCG (not gate acceptance)
    if: github.repository == 'techrote/ezvm' && github.actor == 'techrote' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    # External Actions containment only. Original base-build/READY/stop bounds remain.
    timeout-minutes: 360
    steps:
      - name: Validate fresh owner dispatch
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          COMPARISON_ID: ${{ inputs.comparison_id }}
        run: |
          $env:PSModulePath = [IO.Path]::Combine($PSHOME, 'Modules')
          if ($env:COMPARISON_ID -cne '963336fe3d31447a912d03d7967e7d2d' -or $env:GITHUB_RUN_ATTEMPT -cne '1') {
              throw 'Fresh exact comparison and first attempt required.'
          }

      - name: Checkout reviewed immutable hosted adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: techrote/runloc
          ref: a71e9e1adae1fb749b2325277c4a52dff69d7b6d
          path: Controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact approved candidate independently of workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: 7dfb4ddfdc36b3544cb91c8493a52134abcd9e46
          path: Candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Exact preflight and original complete release portability scenario
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          COMPARISON_ID: ${{ inputs.comparison_id }}
        run: |
          $env:PSModulePath = [IO.Path]::Combine($PSHOME, 'Modules')
          $evidence = Join-Path $env:RUNNER_TEMP ('gate-public-' + $env:COMPARISON_ID)
          [void][IO.Directory]::CreateDirectory($evidence)
          ('GATE_PUBLIC=' + $evidence) | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          $exe = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\Controller\poc\windows-whpx\Invoke-HostedQualification.ps1 -CandidateRoot (Join-Path $env:GITHUB_WORKSPACE 'Candidate') -CandidateCommit 7dfb4ddfdc36b3544cb91c8493a52134abcd9e46 -ControllerCommit a71e9e1adae1fb749b2325277c4a52dff69d7b6d -ComparisonId $env:COMPARISON_ID -EvidenceParent $evidence
          exit $LASTEXITCODE

      - name: Encrypt bounded diagnostic log to owner-held attempt key
        if: always() && env.GATE_PUBLIC != ''
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          COMPARISON_ID: ${{ inputs.comparison_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PSModulePath = [IO.Path]::Combine($PSHOME, 'Modules')
          . .\Controller\poc\windows-whpx\Pilot.Common.ps1
          $evidence = Assert-PilotPath -Path $env:GATE_PUBLIC
          $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP ('gate-public-' + $env:COMPARISON_ID)))
          if ($env:COMPARISON_ID -cne '963336fe3d31447a912d03d7967e7d2d' -or $evidence -cne $expected) { throw 'forensic-evidence-root-mismatch' }
          $roots = @(Get-ChildItem -LiteralPath $evidence -Directory -Filter 'runloc-whpx-*')
          if ($roots.Count -ne 1 -or $roots[0].Name -cnotmatch '^runloc-whpx-[a-f0-9]{32}$') { throw 'forensic-lease-count' }
          $root = Assert-PilotPath -Path $roots[0].FullName
          $owner = [IO.File]::ReadAllText((Assert-PilotPath -Path (Join-Path $root 'lease.json') -File)) | ConvertFrom-Json
          if ($owner.root -cne $root -or ('runloc-whpx-' + $owner.leaseId) -cne $roots[0].Name -or
              $owner.candidateCommit -cne '7dfb4ddfdc36b3544cb91c8493a52134abcd9e46' -or
              $owner.controllerCommit -cne 'a71e9e1adae1fb749b2325277c4a52dff69d7b6d') { throw 'forensic-lease-binding' }
          $lock = [IO.File]::Open((Join-Path $root 'active.lock'), 'Open', 'ReadWrite', 'None')
          try {
              $private = Assert-PilotPath -Path (Join-Path $root 'private')
              $raw = Assert-PilotPath -Path (Join-Path $private 'harness.log') -File
              if ((Get-Item -LiteralPath $raw).Length -gt 8388608) { throw 'forensic-log-size-bound' }
              $receipt = [IO.File]::ReadAllText((Join-Path $evidence 'hosted-receipt.json')) | ConvertFrom-Json
              if ($receipt.comparisonId -cne $env:COMPARISON_ID -or $receipt.runId -ne [long]$env:GITHUB_RUN_ID -or
                  $receipt.workflowCommit -cne $env:GITHUB_SHA -or $receipt.diagnostics.rawLogBytes -ne (Get-Item -LiteralPath $raw).Length -or $receipt.diagnostics.rawLogSha256 -cne (Get-PilotDigest $raw)) { throw 'forensic-log-receipt-binding' }
              $cert = Join-Path $private 'forensic-recipient-public.pem'
              if ([IO.File]::Exists($cert)) { throw 'forensic-recipient-already-exists' }
              [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String(''))
              if ((Get-PilotDigest $cert) -cne 'c978a239190bf78a34e108ac75341bc2a4dfacc5740df7868039a2d87729de08') { throw 'forensic-recipient-mismatch' }
              $cipher = Join-Path $evidence 'forensic-harness.cms'
              if ([IO.File]::Exists($cipher)) { throw 'forensic-ciphertext-already-exists' }
              $openssl = Assert-PilotPath -Path (Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe') -File
              $clock = [Diagnostics.Stopwatch]::StartNew()
              $result = Invoke-PilotChild -Executable $openssl -Arguments @('cms','-encrypt','-binary','-aes-256-gcm','-in',$raw,'-out',$cipher,'-outform','DER','-recip',$cert,'-keyopt','rsa_padding_mode:oaep','-keyopt','rsa_oaep_md:sha256','-keyopt','rsa_mgf1_md:sha256') -WorkingDirectory $private -TemporaryDirectory $private -RawLogPath (Join-Path $private 'forensic-encryption.log') -Clock $clock -ExecutionDeadlineSeconds 60 -CleanupDeadlineSeconds 70
              if ($result.exitCode -ne 0 -or -not $result.childExited -or $result.activeProcesses -ne 0 -or $result.forced -or $result.timedOut -or $result.cancelled -or $result.outputFailed -or $result.outputOverflow -or
                  -not [IO.File]::Exists($cipher) -or (Get-Item -LiteralPath $cipher).Length -gt 8454144 -or (Get-PilotDigest $raw) -cne $receipt.diagnostics.rawLogSha256) { throw 'forensic-encryption-failed' }
              Write-PilotNewJson -Path (Join-Path $evidence 'forensic-envelope.json') -Value @{schemaVersion=1;diagnosticOnly=$true;qualificationPassed=$false;comparisonId=$env:COMPARISON_ID;runId=[long]$env:GITHUB_RUN_ID;workflowCommit=$env:GITHUB_SHA;candidateCommit=$owner.candidateCommit;controllerCommit=$owner.controllerCommit;leaseId=$owner.leaseId;encryption='CMS-AES-256-GCM-RSA-OAEP-SHA256-MGF1-SHA256';recipientSha256=(Get-PilotDigest $cert);ciphertextSha256=(Get-PilotDigest $cipher);ciphertextBytes=(Get-Item -LiteralPath $cipher).Length;plaintextSha256=$receipt.diagnostics.rawLogSha256;plaintextBytes=$receipt.diagnostics.rawLogBytes;opensslSha256=(Get-PilotDigest $openssl);encryptionExitCode=$result.exitCode;activeEncryptionProcesses=$result.activeProcesses}
          } finally { $lock.Dispose() }

      - name: Retain encrypted diagnostic only (never plaintext or keys)
        if: always() && env.GATE_PUBLIC != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-poc-003-forensic-encrypted-${{ inputs.comparison_id }}
          path: |
            ${{ env.GATE_PUBLIC }}/forensic-harness.cms
            ${{ env.GATE_PUBLIC }}/forensic-envelope.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain named public evidence only
        if: always() && env.GATE_PUBLIC != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-poc-003-forensic-public-${{ inputs.comparison_id }}
          # The parent also contains private leases/logs. Never upload its directory.
          path: |
            ${{ env.GATE_PUBLIC }}/hosted-receipt.json
            ${{ env.GATE_PUBLIC }}/hosted-receipt-digest.json
            ${{ env.GATE_PUBLIC }}/telemetry-events.json
          if-no-files-found: error
          retention-days: 14
