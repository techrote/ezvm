name: DASH-08 lifecycle boundary

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/Invoke-Dash08Qualification.ps1'
      - 'docs/rag/**'
      - 'docs/programme/dashboard/**'
      - 'docs/research/TRIO-2026-10/DASH-08-LIFECYCLE.md'
      - '.github/workflows/dash08-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/Invoke-Dash08Qualification.ps1'
      - 'docs/rag/**'
      - 'docs/programme/dashboard/**'
      - 'docs/research/TRIO-2026-10/DASH-08-LIFECYCLE.md'
      - '.github/workflows/dash08-lifecycle.yml'

permissions:
  contents: read

concurrency:
  group: dash08-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boundary:
    name: DASH-08 process and deadline qualification (PowerShell ${{ matrix.major }})
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        major: [5, 7]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned PowerShell 7
        if: matrix.major == 7
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = .\scripts\Install-TestPowerShell.ps1 -DestinationRoot $env:RUNNER_TEMP
          ('EZVM_TEST_POWERSHELL=' + $executable) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record exact source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real native-process and deterministic lifecycle regressions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = Join-Path $PSHOME 'powershell.exe'
          if (${{ matrix.major }} -eq 7) { $executable = $env:EZVM_TEST_POWERSHELL }
          & $executable -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Invoke-Dash08Qualification.ps1 -ExpectedMajor ${{ matrix.major }} -OutputDirectory (Join-Path $env:RUNNER_TEMP 'dash08-evidence')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain measured receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dash08-powershell-${{ matrix.major }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dash08-evidence/
          if-no-files-found: error
          retention-days: 14
