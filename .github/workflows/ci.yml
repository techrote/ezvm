name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository contract (Windows PowerShell 5.1)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tracked sources, programme and RAG contract
        shell: powershell
        run: .\scripts\Invoke-CiCheck.ps1 -Check Repository -ExpectedMajor 5

  control-plane-tests:
    name: Control plane (${{ matrix.label }})
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows PowerShell 5.1
            major: 5
          - label: PowerShell 7.6.6
            major: 7
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned current PowerShell test runtime
        if: matrix.major == 7
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = .\scripts\Install-TestPowerShell.ps1 -DestinationRoot $env:RUNNER_TEMP
          ('EZVM_TEST_POWERSHELL=' + $executable) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run versioned first-party test harness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = Join-Path $PSHOME 'powershell.exe'
          if (${{ matrix.major }} -eq 7) { $executable = $env:EZVM_TEST_POWERSHELL }
          & $executable -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Invoke-CiCheck.ps1 -Check ControlPlane -ExpectedMajor ${{ matrix.major }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  guest-venv-probe:
    name: Guest venv probe (Linux processes; not VM acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select existing pinned test interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Execute disposable Linux guest-probe boundaries
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}'
          python --version
          cat /etc/os-release
          sha256sum guest/profiles/coding-default/v1/provision.sh tests/guest/test_venv_probe.py
          sh -n guest/profiles/coding-default/v1/provision.sh
          # Root is needed only for temporary ownership fixtures and runuser to
          # the existing nobody account; no account/mount/VM is created.
          sudo "$(command -v python)" -I tests/guest/test_venv_probe.py
          test -z "$(git status --porcelain --untracked-files=normal)"
