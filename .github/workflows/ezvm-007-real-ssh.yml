name: EZVM-007 real SSH qualification

on:
  push:
    branches:
      - ezvm-007-ssh-network
    paths:
      - .github/workflows/ezvm-007-real-ssh.yml
      - scripts/Invoke-EzVm007RealSsh.ps1
      - src/EzVm/Ssh.ps1
      - src/EzVm/Runtime.ps1
      - src/EzVm/SeedServer.ps1
      - src/EzVm/Storage.ps1
      - src/EzVm/BaseBuilder.ps1
      - src/EzVm/BaseRecipe.ps1
      - src/EzVm/Qemu.ps1
      - src/EzVm/SourceImage.ps1
      - manifests/qemu-windows.json
      - manifests/ubuntu-noble-amd64.json

concurrency:
  group: ezvm-007-real-ssh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-ssh:
    name: Real Ubuntu SSH/readiness (Windows TCG; WHPX SKIP)
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Qualify instance NoCloud, managed SSH, exec and copy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\Invoke-EzVm007RealSsh.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
