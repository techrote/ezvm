name: CI-PoC003 hosted timer isolation
run-name: CI-PoC003 timer ${{ inputs.comparison_id }}
on:
  workflow_dispatch:
    inputs:
      comparison_id:
        description: Exact fresh diagnostic identifier
        required: true
        type: string
permissions:
  contents: read
jobs:
  hosted-tcg:
    name: Six-CPU timer A-B diagnostic (never qualification)
    if: github.repository == 'techrote/ezvm' && github.actor == 'techrote' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Validate fresh owner dispatch
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          COMPARISON_ID: ${{ inputs.comparison_id }}
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath=[IO.Path]::Combine($PSHOME,'Modules')
          if($env:COMPARISON_ID -cne '5c4e91c694c24c4baa7ba406d34749bb' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'exact-fresh-timer-attempt-required'}
      - name: Checkout immutable diagnostic controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: techrote/runloc
          ref: 3db4aa240eadc2af903bcab935712e7be367393f
          path: Controller
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout unchanged approved candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: 2268468cb3040b9e1dd6deed60d0f13594f768d6
          path: Candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Exact preflight and contained paired early boots
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          COMPARISON_ID: ${{ inputs.comparison_id }}
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath=[IO.Path]::Combine($PSHOME,'Modules')
          $private=Join-Path $env:RUNNER_TEMP ('timer-private-'+$env:COMPARISON_ID)
          $public=Join-Path $env:RUNNER_TEMP ('timer-public-'+$env:COMPARISON_ID)
          foreach($path in @($private,$public)){if(Test-Path -LiteralPath $path){throw 'timer-attempt-directory-exists'};[void][IO.Directory]::CreateDirectory($path)}
          . .\Controller\poc\windows-whpx\Pilot.Common.ps1
          Set-PilotPrivateDirectory -Path $private
          $capacity=[IO.File]::Open((Join-Path $private 'runner-capacity.lock'),'CreateNew','ReadWrite','None');$capacity.Dispose()
          ('TIMER_PRIVATE='+$private)|Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          ('TIMER_PUBLIC='+$public)|Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          $exe=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\Controller\poc\windows-whpx\Invoke-TimerProbe.ps1 -CandidateRoot (Join-Path $env:GITHUB_WORKSPACE 'Candidate') -ControllerCommit 3db4aa240eadc2af903bcab935712e7be367393f -EvidenceParent $private -BackingRoot $private -HostedDiagnostic
          exit $LASTEXITCODE
      - name: Bind public projection and encrypt private serial evidence
        if: always() && env.TIMER_PRIVATE != ''
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          COMPARISON_ID: ${{ inputs.comparison_id }}
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath=[IO.Path]::Combine($PSHOME,'Modules')
          . .\Controller\poc\windows-whpx\Pilot.Common.ps1
          $private=Assert-PilotPath -Path $env:TIMER_PRIVATE
          $public=Assert-PilotPath -Path $env:TIMER_PUBLIC
          if($env:COMPARISON_ID -cne '5c4e91c694c24c4baa7ba406d34749bb' -or $private -cne (Join-Path $env:RUNNER_TEMP ('timer-private-'+$env:COMPARISON_ID)) -or $public -cne (Join-Path $env:RUNNER_TEMP ('timer-public-'+$env:COMPARISON_ID))){throw 'timer-root-binding-failed'}
          $leases=@(Get-ChildItem -LiteralPath $private -Directory -Filter 'runloc-whpx-*')
          if($leases.Count -ne 1 -or $leases[0].Name -cnotmatch '^runloc-whpx-[a-f0-9]{32}$'){throw 'timer-lease-count'}
          $root=Assert-PilotPath -Path $leases[0].FullName
          $owner=[IO.File]::ReadAllText((Join-Path $root 'lease.json'))|ConvertFrom-Json
          if($owner.root -cne $root -or ('runloc-whpx-'+$owner.leaseId) -cne $leases[0].Name -or $owner.candidateCommit -cne '2268468cb3040b9e1dd6deed60d0f13594f768d6' -or $owner.controllerCommit -cne '3db4aa240eadc2af903bcab935712e7be367393f'){throw 'timer-lease-binding'}
          $lock=[IO.File]::Open((Join-Path $root 'active.lock'),'Open','ReadWrite','None')
          try{
              $receiptPath=Assert-PilotPath -Path (Join-Path $root 'timer-probe-receipt.json') -File
              if((Get-Item -LiteralPath $receiptPath).Length -gt 4194304){throw 'timer-receipt-size'}
              $receipt=[IO.File]::ReadAllText($receiptPath)|ConvertFrom-Json
              if(-not $receipt.hostedDiagnostic -or -not $receipt.diagnosticOnly -or $receipt.qualificationPassed -or $receipt.hostContext.repository -cne 'techrote/ezvm' -or $receipt.hostContext.runId -cne $env:GITHUB_RUN_ID -or $receipt.hostContext.workflowCommit -cne $env:GITHUB_SHA -or $receipt.candidate.commit -cne $owner.candidateCommit -or $receipt.controller.commit -cne $owner.controllerCommit){throw 'timer-receipt-binding'}
              $caseRecords=@();$serials=@();$seen=@{}
              foreach($case in $receipt.cases){
                  if($case.name -cnotmatch '^boot-[123]-(default|off)$' -or $case.hpet -cnotin @('default','off') -or $case.requestedCpus -ne 6 -or $case.qualificationPassed -or $case.classification -cnotin @('kernel-panic','early-boot-observed-not-qualified','inconclusive')){throw 'timer-case-binding'}
                  if($seen.ContainsKey($case.name) -or -not $case.name.EndsWith('-'+$case.hpet,[StringComparison]::Ordinal)){throw 'timer-duplicate-or-mode-mismatch'};$seen[$case.name]=$true
                  $arguments=@($case.arguments);$machineIndex=[Array]::IndexOf($arguments,'-machine');$cpuIndex=[Array]::IndexOf($arguments,'-smp');$accelIndex=[Array]::IndexOf($arguments,'-accel')
                  if($machineIndex -lt 0 -or $cpuIndex -lt 0 -or $accelIndex -lt 0 -or $arguments[$machineIndex+1] -cne $(if($case.hpet -ceq 'off'){'q35,hpet=off'}else{'q35'}) -or $arguments[$cpuIndex+1] -cne '6' -or $arguments[$accelIndex+1] -cne 'tcg,thread=multi'){throw 'timer-actual-arguments-mismatch'}
                  if(@($arguments|Where-Object {$_ -ceq '-netdev'}).Count -ne 1 -or $arguments -cnotcontains 'user,id=net0,ipv6=off,restrict=on' -or $arguments -cnotcontains 'virtio-net-pci,netdev=net0' -or ($arguments -join ' ') -match 'hostfwd|guestfwd|smb=|tftp=|-virtfs|-fsdev'){throw 'timer-network-isolation-mismatch'}
                  $serial=Assert-PilotPath -Path (Join-Path $root ('private/'+$case.name+'-serial.private.log')) -File
                  if((Get-Item -LiteralPath $serial).Length -gt 2097152 -or (Get-PilotDigest $serial) -cne $case.serialSha256){throw 'timer-serial-binding'}
                  $serials+=@{name=$case.name;sha256=$case.serialSha256;bytesBase64=[Convert]::ToBase64String([IO.File]::ReadAllBytes($serial))}
                  $kernel=[string]$case.signals.kernelVersion;if($kernel -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.-]+$'){$kernel='unobserved'}
                  $caseRecords+=@{name=$case.name;hpet=$case.hpet;machine=$arguments[$machineIndex+1];accelerator=$arguments[$accelIndex+1];cpus=6;network='restricted-user-no-forwarding';classification=$case.classification;kernelVersion=$kernel;kernelPanic=[bool]$case.signals.kernelPanic;ioApicTimerPanic=[bool]$case.signals.ioApicTimerPanic;kernelSixCpuObserved=[bool]$case.signals.kernelSixCpuObserved;kernelInitObserved=[bool]$case.signals.kernelInitObserved;actualExitCode=$case.actualExitCode;terminationIssued=$case.terminationIssued;activeProcesses=$case.activeProcesses;elapsedSeconds=$case.elapsedSeconds;serialSha256=$case.serialSha256;firmwareCodeSha256=$case.firmwareCodeSha256;firmwareVariablesInitialSha256=$case.firmwareVariablesInitialSha256}
              }
              $bundle=Join-Path $root 'private/timer-bundle.private.json'
              Write-PilotNewJson -Path $bundle -Value @{diagnosticOnly=$true;qualificationPassed=$false;receipt=$receipt;originalReceiptBytesBase64=[Convert]::ToBase64String([IO.File]::ReadAllBytes($receiptPath));serials=$serials}
              if((Get-Item -LiteralPath $bundle).Length -gt 8388608){throw 'timer-private-bundle-size'}
              $rawDigest=Get-PilotDigest $bundle
              $cert=Join-Path $root 'private/timer-recipient.pem'
              if([IO.File]::Exists($cert)){throw 'timer-recipient-replay'}
              [IO.File]::WriteAllBytes($cert,[Convert]::FromBase64String(''))
              if((Get-PilotDigest $cert) -cne '1ac649b83b43756006a57ca7c97674df377af4808fe65c0e968d06044e909c5f'){throw 'timer-recipient-binding'}
              $cipher=Join-Path $public 'timer-private.cms'
              if([IO.File]::Exists($cipher)){throw 'timer-cipher-replay'}
              $openssl=Assert-PilotPath -Path (Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe') -File
              $clock=[Diagnostics.Stopwatch]::StartNew()
              $encrypted=Invoke-PilotChild -Executable $openssl -Arguments @('cms','-encrypt','-binary','-aes-256-gcm','-in',$bundle,'-out',$cipher,'-outform','DER','-recip',$cert,'-keyopt','rsa_padding_mode:oaep','-keyopt','rsa_oaep_md:sha256','-keyopt','rsa_mgf1_md:sha256') -WorkingDirectory (Join-Path $root 'private') -TemporaryDirectory (Join-Path $root 'private') -RawLogPath (Join-Path $root 'private/encryption.log') -Clock $clock -ExecutionDeadlineSeconds 60 -CleanupDeadlineSeconds 70
              if($encrypted.exitCode -ne 0 -or -not $encrypted.childExited -or $encrypted.activeProcesses -ne 0 -or $encrypted.forced -or $encrypted.timedOut -or $encrypted.cancelled -or $encrypted.outputFailed -or $encrypted.outputOverflow -or -not [IO.File]::Exists($cipher) -or (Get-Item -LiteralPath $cipher).Length -gt 8454144 -or (Get-PilotDigest $bundle) -cne $rawDigest){throw 'timer-encryption-failed'}
              $os=Get-CimInstance Win32_OperatingSystem
              $processors=@(Get-CimInstance Win32_Processor|ForEach-Object {$_.Name.Trim()}|Select-Object -Unique)
              $hostFacts=@{osCaption=$os.Caption;osVersion=$os.Version;osBuild=$os.BuildNumber;cpuModels=$processors;logicalProcessors=[Environment]::ProcessorCount;totalMemoryBytes=[long]$os.TotalVisibleMemorySize*1024;imageOS=$env:ImageOS;imageVersion=$env:ImageVersion}
              $summary=@{schemaVersion=1;diagnosticOnly=$true;qualificationPassed=$false;comparisonId=$env:COMPARISON_ID;runId=[long]$env:GITHUB_RUN_ID;runAttempt=1;workflowCommit=$env:GITHUB_SHA;candidate=$receipt.candidate;controller=$receipt.controller;hostContext=$receipt.hostContext;host=$hostFacts;hostLogicalProcessors=[Environment]::ProcessorCount;requestedGuestCpus=6;elapsedSeconds=$receipt.elapsedSeconds;sourceUnchanged=$receipt.sourceUnchanged;processesResolved=$receipt.processesResolved;fixtureRemoved=$receipt.fixtureRemoved;fixtureQuarantined=$receipt.fixtureQuarantined;failure=$receipt.failure;cases=$caseRecords;identities=$receipt.identities;originalPrivateReceiptSha256=(Get-PilotDigest $receiptPath);plaintextSha256=$rawDigest;plaintextBytes=(Get-Item -LiteralPath $bundle).Length;ciphertextSha256=(Get-PilotDigest $cipher);ciphertextBytes=(Get-Item -LiteralPath $cipher).Length;recipientSha256=(Get-PilotDigest $cert);encryption='CMS-AES-256-GCM-RSA-OAEP-SHA256-MGF1-SHA256';encryptionExitCode=$encrypted.exitCode;activeEncryptionProcesses=$encrypted.activeProcesses;opensslSha256=(Get-PilotDigest $openssl)}
              Write-PilotNewJson -Path (Join-Path $public 'timer-summary.json') -Value $summary
              Write-PilotNewJson -Path (Join-Path $public 'timer-summary-digest.json') -Value @{schemaVersion=1;file='timer-summary.json';sha256=(Get-PilotDigest (Join-Path $public 'timer-summary.json'))}
              foreach($case in $caseRecords){Write-Host ('TIMER_DIAGNOSTIC_RESULT='+($case|ConvertTo-Json -Compress))}
          }finally{$lock.Dispose()}
      - name: Retain exact bounded public summary and encrypted private evidence
        if: always() && env.TIMER_PUBLIC != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-poc-003-timer-${{ inputs.comparison_id }}
          path: |
            ${{ env.TIMER_PUBLIC }}/timer-summary.json
            ${{ env.TIMER_PUBLIC }}/timer-summary-digest.json
            ${{ env.TIMER_PUBLIC }}/timer-private.cms
          if-no-files-found: error
          retention-days: 7
