name: Pin discovery

on:
  push:
    branches:
      - ezvm-002-portable-qemu

permissions:
  contents: read

jobs:
  discover:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Resolve reviewed provider pins and extraction layout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'ezvm-pin-discovery'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $qemuUrl = 'https://qemu.weilnetz.de/w64/qemu-w64-setup-20260811.exe'
          $qemuHashUrl = 'https://qemu.weilnetz.de/w64/qemu-w64-setup-20260811.sha512'
          $qemuInstaller = Join-Path $root 'qemu-w64-setup-20260811.exe'
          $qemuSidecar = Join-Path $root 'qemu.sha512'
          Invoke-WebRequest -Uri $qemuHashUrl -OutFile $qemuSidecar -UseBasicParsing
          $expectedQemuSha512 = ((Get-Content -LiteralPath $qemuSidecar -Raw) -split '\s+')[0].ToLowerInvariant()
          Invoke-WebRequest -Uri $qemuUrl -OutFile $qemuInstaller -UseBasicParsing
          $observedQemuSha512 = (Get-FileHash -LiteralPath $qemuInstaller -Algorithm SHA512).Hash.ToLowerInvariant()
          $observedQemuSha256 = (Get-FileHash -LiteralPath $qemuInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedQemuSha512 -cne $observedQemuSha512) { throw 'QEMU provider SHA-512 mismatch.' }
          Write-Host ('PIN QEMU_SHA512=' + $observedQemuSha512)
          Write-Host ('PIN QEMU_SHA256=' + $observedQemuSha256)
          Write-Host ('PIN QEMU_SIZE=' + (Get-Item -LiteralPath $qemuInstaller).Length)

          $sevenZrUrl = 'https://github.com/ip7z/7zip/releases/download/26.04/7zr.exe'
          $sevenPackageUrl = 'https://github.com/ip7z/7zip/releases/download/26.04/7z2604-x64.exe'
          $sevenZr = Join-Path $root '7zr.exe'
          $sevenPackage = Join-Path $root '7z2604-x64.exe'
          Invoke-WebRequest -Uri $sevenZrUrl -OutFile $sevenZr -UseBasicParsing
          Invoke-WebRequest -Uri $sevenPackageUrl -OutFile $sevenPackage -UseBasicParsing
          $sevenZrHash = (Get-FileHash -LiteralPath $sevenZr -Algorithm SHA256).Hash.ToLowerInvariant()
          $sevenPackageHash = (Get-FileHash -LiteralPath $sevenPackage -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sevenZrHash -cne '256feca8e274e5da655e2a284fabafd9f554365eb164862089dacd4e8276d282') { throw '7zr provider hash mismatch.' }
          if ($sevenPackageHash -cne 'd54bf805f9f3704d1e8db2fa3498ae7ef2df0312b40b558e7c71c734430a665d') { throw '7-Zip package provider hash mismatch.' }

          $sevenStage = Join-Path $root '7zip'
          New-Item -ItemType Directory -Path $sevenStage | Out-Null
          & $sevenZr x $sevenPackage ('-o' + $sevenStage) -y
          if ($LASTEXITCODE -ne 0) { throw "7zr could not unpack the verified 7-Zip package: $LASTEXITCODE" }
          $fullSeven = Get-ChildItem -LiteralPath $sevenStage -Filter '7z.exe' -File -Recurse | Select-Object -First 1
          $fullDll = Get-ChildItem -LiteralPath $sevenStage -Filter '7z.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $fullSeven -or $null -eq $fullDll) { throw 'Full 7-Zip payload was not found.' }
          Write-Host ('PIN 7ZR_SHA256=' + $sevenZrHash)
          Write-Host ('PIN 7ZIP_PACKAGE_SHA256=' + $sevenPackageHash)
          Write-Host ('PIN 7ZIP_EXE=' + $fullSeven.FullName)
          & $fullSeven.FullName i | Select-Object -First 12 | ForEach-Object { Write-Host ('7ZIP ' + $_) }

          $qemuStage = Join-Path $root 'qemu'
          New-Item -ItemType Directory -Path $qemuStage | Out-Null
          & $fullSeven.FullName x $qemuInstaller ('-o' + $qemuStage) -y
          if ($LASTEXITCODE -ne 0) { throw "Full 7-Zip could not unpack QEMU NSIS: $LASTEXITCODE" }
          Write-Host 'QEMU_LAYOUT_BEGIN'
          Get-ChildItem -LiteralPath $qemuStage -Force | ForEach-Object { Write-Host ('QEMU_TOP ' + $_.Name) }
          $qemuSystem = Get-ChildItem -LiteralPath $qemuStage -Filter 'qemu-system-x86_64.exe' -File -Recurse | Select-Object -First 1
          $qemuImg = Get-ChildItem -LiteralPath $qemuStage -Filter 'qemu-img.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $qemuSystem -or $null -eq $qemuImg) { throw 'QEMU executables were not found after extraction.' }
          Write-Host ('QEMU_SYSTEM_PATH=' + $qemuSystem.FullName)
          Write-Host ('QEMU_IMG_PATH=' + $qemuImg.FullName)
          & $qemuSystem.FullName --version | ForEach-Object { Write-Host ('QEMU_SYSTEM_VERSION=' + $_) }
          & $qemuImg.FullName --version | Select-Object -First 1 | ForEach-Object { Write-Host ('QEMU_IMG_VERSION=' + $_) }

          $ubuntuSums = Join-Path $root 'ubuntu-SHA256SUMS'
          Invoke-WebRequest -Uri 'https://cloud-images.ubuntu.com/releases/noble/release-20260926/SHA256SUMS' -OutFile $ubuntuSums -UseBasicParsing
          $ubuntuLine = Get-Content -LiteralPath $ubuntuSums | Where-Object { $_ -match '\*ubuntu-24\.04-server-cloudimg-amd64\.img$' } | Select-Object -First 1
          if (-not $ubuntuLine) { throw 'Ubuntu amd64 release image checksum was not found.' }
          Write-Host ('PIN UBUNTU_LINE=' + $ubuntuLine)
