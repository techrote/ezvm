name: CI-PoC003 venv stage diagnostic
run-name: CI-PoC003 venv stages ${{ inputs.attempt_id }}
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Fresh owner allocated UUID; diagnostic only
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'techrote/ezvm' && github.actor == 'techrote' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Validate fresh owner dispatch
        shell: powershell
        env:
          ATTEMPT_ID: ${{ inputs.attempt_id }}
        run: |
          if ($env:ATTEMPT_ID -cnotmatch '^[a-f0-9]{32}$' -or $env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'Fresh first-attempt owner diagnostic required.' }
      - name: Checkout immutable diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          path: Candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout reviewed owned process controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: techrote/runloc
          ref: a71e9e1adae1fb749b2325277c4a52dff69d7b6d
          path: Controller
          fetch-depth: 0
          persist-credentials: false
      - name: Focused offline diagnostic controls
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Exercise stage failure and source controls
        shell: powershell
        run: |
          python -B .\Candidate\tests\Test-VenvStages.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fixed fresh six-CPU TCG venv stage comparison
        shell: powershell
        env:
          ATTEMPT_ID: ${{ inputs.attempt_id }}
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:RUNNER_TEMP ('venv-stages-'+$env:ATTEMPT_ID)
          [void][IO.Directory]::CreateDirectory($evidence)
          ('STAGE_PUBLIC='+$evidence)|Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          .\Candidate\scripts\diagnostics\Invoke-VenvStages.ps1 -ControllerRoot (Join-Path $env:GITHUB_WORKSPACE 'Controller') -EvidenceParent $evidence -AttemptId $env:ATTEMPT_ID -SourceCommit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID
      - name: Retain fixed diagnostic result only
        if: always() && env.STAGE_PUBLIC != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-poc-003-venv-stages-${{ inputs.attempt_id }}
          path: ${{ env.STAGE_PUBLIC }}/venv-stage-result.json
          if-no-files-found: error
          retention-days: 14
