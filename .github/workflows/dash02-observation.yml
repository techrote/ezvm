name: DASH-02 scoped observation

on:
  pull_request:
    paths:
      - dashboard/**
      - docs/research/**
      - docs/programme/dashboard/**
      - docs/rag/dashboard/**
      - .github/workflows/dash02-observation.yml
  push:
    branches: [main]
    paths:
      - dashboard/**
      - docs/research/**
      - docs/programme/dashboard/**
      - docs/rag/dashboard/**
      - .github/workflows/dash02-observation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dash02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observation:
    name: DASH-02 Windows adapter and input qualification
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install existing hash-pinned Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r dashboard/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify identities, fair coverage, failure isolation and real input dispatch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B dashboard/qualify_observation.py --output "$env:RUNNER_TEMP/dash02-observation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -Raw "$env:RUNNER_TEMP/dash02-observation.json"
          ./scripts/Test-DashboardPlan.ps1
      - name: Retain public synthetic qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dash02-windows-${{ github.sha }}
          path: ${{ runner.temp }}/dash02-observation.json
          if-no-files-found: error
          retention-days: 14
