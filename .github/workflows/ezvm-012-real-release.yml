name: EZVM-012 real release qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ezvm-012-real-release.yml
      - .github/workflows/release.yml
      - scripts/Invoke-EzVm010RealPortability.ps1
      - scripts/Install-TestPowerShell.ps1
      - scripts/TcgQualification.ps1
      - tests/tooling.json
      - tests/TcgQualification.Tests.ps1
      - scripts/New-EzVmReleasePackage.ps1
      - scripts/Publish-EzVmGitHubRelease.ps1
      - src/EzVm/**
      - guest/**
      - manifests/**
      - config/**
      - docs/**
      - README.md
      - THIRD-PARTY-NOTICES.md

permissions:
  contents: read

concurrency:
  group: ezvm-012-real-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-poc-tcg-deferred:
    # Owner-authorized on 2026-10-17 until Runloc CI-POC-003 (#23) completes.
    # Keep a visible SKIP notice and the existing workflow concurrency group.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'ci-poc-') ||
       github.event.pull_request.head.ref == 'ezvm-ci-whpx-pilot')
    name: Hosted TCG deferral notice (not qualification)
    runs-on: windows-2022
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record temporary owner-authorized deferral
        shell: powershell
        run: |
          Write-Host 'EZVM012_HOSTED_TCG=SKIP: owner deferred automatic full TCG for CI-PoC on 2026-10-17; coverage is unmeasured.'
          @'
          ## Full hosted TCG deferred for CI-PoC
          The owner authorized this temporary PR deferral on 2026-10-17.
          TCG coverage and performance are unmeasured; this notice is not a qualification PASS.
          Software and standard-user ACL checks continue. Physical WHPX acceptance remains required.
          Manual workflow_dispatch remains available. Remove or replace this exception when
          [Runloc CI-POC-003](https://github.com/techrote/runloc/issues/23) completes.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

  real-release:
    # Temporary owner exception above defers only these same-repository CI-PoC PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'ci-poc-') &&
       github.event.pull_request.head.ref != 'ezvm-ci-whpx-pilot')
    name: Real v0.1 end-to-end release (Windows TCG; WHPX SKIP)
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record runner and exact source identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host ('EZVM012_REQUESTED_RUNNER=windows-2022; observedCPU=' + [Environment]::ProcessorCount)
          Write-Host 'EZVM012_WHPX_EXECUTION=SKIP: hosted qualification uses explicit TCG; no WHPX runtime PASS is claimed.'
          $PSVersionTable

      - name: Prepare pinned release qualification runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = .\scripts\Install-TestPowerShell.ps1 -DestinationRoot $env:RUNNER_TEMP
          ('EZVM_RELEASE_POWERSHELL=' + $executable) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Qualify complete clean-root v0.1 workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content -LiteralPath .\tests\tooling.json -Raw | ConvertFrom-Json).powerShell7
          $executable = $env:EZVM_RELEASE_POWERSHELL
          $engine = @(& $executable -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSEdition + "/" + $PSVersionTable.PSVersion.ToString()') -join ''
          if ($LASTEXITCODE -ne 0 -or $engine -cne ('Core/' + $pin.version)) { throw 'The release harness must use the verified pinned PowerShell runtime.' }
          Write-Host ('EZVM012_QUALIFICATION_POWERSHELL=' + $engine)
          & $executable -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\Invoke-EzVm010RealPortability.ps1 -ReleaseQualification -TcgTimerCheckWorkaround
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
