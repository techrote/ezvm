name: DASH-08 lifecycle boundary

on:
  push:
    branches: [ezvm-034-lifecycle-prerequisites]

permissions:
  contents: read

concurrency:
  group: dash08-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boundary:
    name: DASH-08 baseline capture (Windows PowerShell 5.1)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source and source-only qualification archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'dash08-evidence'
          [void][IO.Directory]::CreateDirectory($out)
          git rev-parse HEAD 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git archive --format=zip --output="$out/source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure inherited capture without a real VM
        shell: powershell
        run: .\scripts\Measure-Dash08StartPipe.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'dash08-evidence')
      - name: Retain source and measured receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dash08-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/dash08-evidence/
          if-no-files-found: error
          retention-days: 14
