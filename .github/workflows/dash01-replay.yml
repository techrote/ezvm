name: DASH-01 offline evidence

on:
  pull_request:
    paths:
      - dashboard/**
      - docs/research/**
      - docs/programme/dashboard/**
      - docs/rag/dashboard/**
      - .github/workflows/dash01-replay.yml
  push:
    branches: [main]
    paths:
      - dashboard/**
      - docs/research/**
      - docs/programme/dashboard/**
      - docs/rag/dashboard/**
      - .github/workflows/dash01-replay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dash01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: DASH-01 replay (${{ matrix.os }}, Python 3.12.10)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned test interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install existing hash-pinned dashboard dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r dashboard/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test new evidence boundaries and existing Windows dashboard
        shell: pwsh
        run: |
          python --version
          if ($IsWindows) {
            python -B -m unittest discover -s dashboard/tests -v
          } else {
            python -B -m unittest discover -s dashboard/tests -p test_evidence.py -v
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify original research, replay all restart cuts and retain receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = & python -B dashboard/replay.py --source-revision $sha
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          $path = Join-Path $env:RUNNER_TEMP 'dash01-replay.json'
          [IO.File]::WriteAllText($path, ($receipt -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          Write-Output $receipt
          Get-FileHash -Algorithm SHA256 -LiteralPath $path
          if ($IsWindows) { ./scripts/Test-DashboardPlan.ps1 }
      - name: Retain public fixture receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dash01-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/dash01-replay.json
          if-no-files-found: error
          retention-days: 14
