name: CI-PoC003 negative assertion control
run-name: CI-PoC003 assertion ${{ inputs.comparison_id }}

on:
  workflow_dispatch:
    inputs:
      comparison_id:
        description: Fresh source-gate comparison UUID allocated before dispatch
        required: true
        type: string

permissions:
  contents: read

jobs:
  hosted-tcg:
    name: Focused six-CPU TCG assertion control (expected failure)
    if: github.repository == 'techrote/ezvm' && github.actor == 'techrote' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    # Negative-only focused control; original base/READY/stop bounds remain.
    timeout-minutes: 90
    steps:
      - name: Validate fresh owner dispatch
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          COMPARISON_ID: ${{ inputs.comparison_id }}
        run: |
          $env:PSModulePath = [IO.Path]::Combine($PSHOME, 'Modules')
          if ($env:COMPARISON_ID -cnotmatch '^[a-f0-9]{32}$' -or $env:GITHUB_RUN_ATTEMPT -cne '1') {
              throw 'Fresh exact comparison and first attempt required.'
          }

      - name: Checkout reviewed immutable hosted adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: techrote/runloc
          ref: a71e9e1adae1fb749b2325277c4a52dff69d7b6d
          path: Controller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact approved candidate independently of workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: b205230d3f1ade15550bbbb8d8b405d17858c514
          path: Candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticated fixed false guest assertion (expected failure)
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          COMPARISON_ID: ${{ inputs.comparison_id }}
        run: |
          $env:PSModulePath = [IO.Path]::Combine($PSHOME, 'Modules')
          $evidence = Join-Path $env:RUNNER_TEMP ('assertion-public-' + $env:COMPARISON_ID)
          [void][IO.Directory]::CreateDirectory($evidence)
          ('GATE_PUBLIC=' + $evidence) | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          $exe = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\Controller\poc\windows-whpx\Invoke-AssertionControl.ps1 -CandidateRoot (Join-Path $env:GITHUB_WORKSPACE 'Candidate') -CandidateCommit b205230d3f1ade15550bbbb8d8b405d17858c514 -ControllerCommit a71e9e1adae1fb749b2325277c4a52dff69d7b6d -ComparisonId $env:COMPARISON_ID -EvidenceParent $evidence
          exit $LASTEXITCODE

      - name: Retain named public evidence only
        if: always() && env.GATE_PUBLIC != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-poc-003-assertion-${{ inputs.comparison_id }}
          # The parent also contains private leases/logs. Never upload its directory.
          path: |
            ${{ env.GATE_PUBLIC }}/assertion-control-receipt.json
            ${{ env.GATE_PUBLIC }}/assertion-control-receipt-digest.json
          if-no-files-found: error
          retention-days: 14
