name: DASH-02 release diagnosis

on:
  push:
    branches: [ezvm-028-release-diagnosis]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract existing disposable-CI clone boot evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/117229632749/logs" > "$RUNNER_TEMP/failed-release.log"
          python - <<'PY'
          import hashlib, os, pathlib, re
          p = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = (p / 'failed-release.log').read_bytes()
          lines = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw.decode('utf-8', 'replace')).splitlines()
          selected, active = [], False
          for line in lines:
              if 'STATE_FILE=' in line:
                  active = '\\ezvm010-stateful\\' in line
              if active:
                  selected.append(line)
          text = 'Original job 117229632749; log SHA256=' + hashlib.sha256(raw).hexdigest() + '\n' + '\n'.join(selected) + '\n'
          (p / 'stateful-boot.txt').write_text(text, encoding='utf-8')
          print('Extracted stateful clone lines:', len(selected))
          if not selected:
              raise SystemExit('Missing stateful clone diagnostic section')
          PY
      - name: Retain original public CI log and targeted clone evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dash02-stateful-boot-diagnosis
          path: |
            ${{ runner.temp }}/stateful-boot.txt
            ${{ runner.temp }}/failed-release.log
          retention-days: 3
          if-no-files-found: error
