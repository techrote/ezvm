name: EZVM-011 real security and portability qualification

on:
  # Historical EZVM-011 regression lane. EZVM-012 supersedes this on release PRs
  # to avoid running the same expensive portability/security scenario twice.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ezvm-011-real-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-security:
    # Historical qualification remains an explicit manual run on GitHub-hosted Windows.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Real security and portability (Windows TCG; WHPX SKIP)
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record runner and exact source identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host ('EZVM011_REQUESTED_RUNNER=windows-2022; observedCPU=' + [Environment]::ProcessorCount)
          $PSVersionTable
      - name: Qualify verified bootstrap, keys, transfers, refusals and complete cold portability
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\Invoke-EzVm010RealPortability.ps1 -SecurityQualification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
